```yaml
name: MSB Kesişim Tarayıcı

on:
  schedule:
    - cron: '0,15,30,45 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri kur
        run: pip install ccxt pandas numpy requests

      - name: Gönderilen sinyalleri indir (cache)
        uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: sent-signals-cache

      - name: Tarayıcıyı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}

        run: python msb_scanner.py

      - name: Gönderilen sinyalleri kaydet (cache güncelle)
        uses: actions/cache@v4
        with:
          path: sent_signals.json
          key: sent-signals-cache
```
