name: MSB Kesişim Tarayıcı

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri kur
        run: pip install ccxt pandas numpy requests

      - name: Tarayıcıyı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
          OKX_SECRET: ${{ secrets.OKX_SECRET }}
          OKX_PASSWORD: ${{ secrets.OKX_PASSWORD }}
        run: python msb_scanner.py

      - name: State dosyalarını kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          FILES=(state_btc.json state_eth.json)
          EXIST=()
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              EXIST+=("$f")
            fi
          done
          if [ ${#EXIST[@]} -eq 0 ]; then
            echo "State dosyası bulunamadı, atlanıyor."
            exit 0
          fi
          git add "${EXIST[@]}"
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git pull --rebase
          git push
# wake scheduler
